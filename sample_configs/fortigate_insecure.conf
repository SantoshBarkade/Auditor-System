# FortiOS Insecure Firewall Configuration for NEXORA Audit
config system global
    set hostname "CORP-FW-01"
    set timezone 04
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set type physical
        set description "External WAN Interface"
        set allowaccess http telnet ping
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
        set description "Internal LAN Interface"
        set allowaccess http telnet ssh https
    next
end

config firewall policy
    edit 1
        set name "Broad-Internet-Access"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set nat enable
    next
    edit 2
        set name "DMZ-Inbound-Access"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end
