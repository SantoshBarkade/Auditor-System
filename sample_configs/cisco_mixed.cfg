! Cisco IOS-XE Mixed Configuration (Partially Hardened)
version 17.3
service timestamps log datetime msec
service password-encryption
!
hostname BRANCH-RTR-02
!
enable secret 9 $9$mIxEdHaSh123456789abcdefghij
!
aaa new-model
!
ip domain name branch.local
ip ssh version 2
!
interface GigabitEthernet0/0/0
 description WAN Gateway
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/1
 description Office LAN
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
! Overly permissive ACL present on branch router
access-list 102 permit ip any any
!
line vty 0 4
 transport input ssh
 login local
line vty 5 15
 transport input telnet
 login local
!
end
