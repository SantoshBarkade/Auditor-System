# Juniper Junos Insecure Configuration for NEXORA Audit
set system host-name EDGE-SRX-01
set system domain-name enterprise.net

# Insecure cleartext services enabled
set system services telnet
set system services web-management http interface ge-0/0/0.0
set system services ssh

# Weak plaintext root authentication
set system root-authentication plain-text-password InsecureRootPassword2026

set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.10/24
set interfaces ge-0/0/1 unit 0 family inet address 10.20.1.1/24

set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone untrust interfaces ge-0/0/0.0

# Overly permissive security policy with all-to-all and no session logging
set security policies from-zone trust to-zone untrust policy allow-everything match source-address any
set security policies from-zone trust to-zone untrust policy allow-everything match destination-address any
set security policies from-zone trust to-zone untrust policy allow-everything match application any
set security policies from-zone trust to-zone untrust policy allow-everything then permit

# Insecure inbound policy without logging
set security policies from-zone untrust to-zone trust policy inbound-unfiltered match source-address any
set security policies from-zone untrust to-zone trust policy inbound-unfiltered match destination-address any
set security policies from-zone untrust to-zone trust policy inbound-unfiltered match application any
set security policies from-zone untrust to-zone trust policy inbound-unfiltered then permit
