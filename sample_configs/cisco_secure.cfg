! Cisco IOS-XE Secure Hardened Configuration
version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CORE-SEC-RTR-01
!
enable secret 9 $9$aBcDeF1234567890abcdefghijklmnopqrstuv
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain name enterprise.local
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
logging host 10.10.10.50
logging trap informational
!
interface GigabitEthernet0/0/0
 description WAN Gateway
 ip address 198.51.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description Internal LAN
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
! Hardened Access Control List with specific subnets and explicit deny with logging
access-list 101 permit ip 10.10.10.0 0.0.0.255 192.168.1.0 0.0.0.255 log
access-list 101 deny ip any any log
!
! Management ACL for VTY
access-list 50 permit 10.10.10.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 stopbits 2
line vty 0 4
 access-class 50 in
 transport input ssh
 exec-timeout 10 0
 login local
line vty 5 15
 access-class 50 in
 transport input ssh
 exec-timeout 10 0
 login local
!
end
