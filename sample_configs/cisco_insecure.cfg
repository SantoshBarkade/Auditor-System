! Cisco IOS-XE Insecure Sample Configuration for NEXORA Audit
! Hostname and basic device parameters
version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-RTR-01
!
boot-start-marker
boot-end-marker
!
! Insecure enable password (plaintext)
enable password InsecureAdminPass123
!
no aaa new-model
!
ip domain name enterprise.local
ip ssh version 1
!
interface GigabitEthernet0/0/0
 description WAN Gateway
 ip address 198.51.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description Internal LAN
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
! Overly permissive Access Control List allowing all traffic without logging
access-list 101 permit ip any any
!
! Insecure Management VTY lines allowing Telnet and missing access-class restriction
line con 0
 stopbits 2
line vty 0 4
 transport input telnet
 login
line vty 5 15
 transport input all
 login
!
end
