# FortiOS Mixed Configuration
config system global
    set hostname "BRANCH-FW-02"
    set admin-https-redirect enable
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.0
        set type physical
        set allowaccess ping
    next
    edit "port2"
        set vdom "root"
        set ip 10.50.1.1 255.255.255.0
        set type physical
        # Management has HTTPS and SSH but also cleartext HTTP
        set allowaccess http https ssh
    next
end

config firewall policy
    edit 101
        set name "Branch-Internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "BRANCH_LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "HTTP"
        set logtraffic all
    next
end
