# FortiOS Hardened Firewall Configuration
config system global
    set hostname "CORP-SEC-FW-01"
    set admin-sport 8443
    set admin-https-redirect enable
    set admin-lockout-threshold 3
    set admin-lockout-duration 600
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set type physical
        set description "External WAN Interface"
        set allowaccess ping
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
        set description "Internal LAN Interface"
        set allowaccess ssh https
    next
end

config firewall policy
    edit 10
        set name "Corporate-Outbound-Web"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "CORP_INTERNAL_NET"
        set dstaddr "INTERNET_DESTINATIONS"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set logtraffic all
        set nat enable
    next
    edit 20
        set name "Default-Deny-All"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
