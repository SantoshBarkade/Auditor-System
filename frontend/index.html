<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Network Configuration Security Auditor</title>
  </head>
  <body>
    <div id="error-overlay" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; z-index: 9999; position: relative;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-overlay').innerText += '\n' + e.message + '\n' + e.filename + ':' + e.lineno + '\n';
        if (e.error && e.error.stack) {
          document.getElementById('error-overlay').innerText += e.error.stack + '\n';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
